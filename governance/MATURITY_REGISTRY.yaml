schema_version: 1
status: living_source_of_truth
model:
  lifecycle: [DISCOVERED, MAPPED, CONNECTED, FUNCTIONAL, VALIDATED, MATURE, PRODUCTION_READY, OPTIMIZED]
  formula: "M = 0.20F + 0.15I + 0.15R + 0.15U + 0.15C + 0.10S + 0.10O"
  warning: "Heuristic only. Unknown dimensions stay unknown. Clinical validation is tracked separately."

workflows:
  - workflow_id: longitudinal.lab_to_trajectory
    name: Lab result to personal baseline/trend to longitudinal trajectory
    strategic_priority: highest_current_lane
    maturity_level: FUNCTIONAL
    clinical_validation: none  # no human assessment recorded. Study infrastructure is software-ready (study 'lab-tren-pribadi' v1, 30 frozen synthetic cases, reviewer UI, audit chain, report) and is externally blocked on qualified clinicians executing it
    dimensions:
      functional_completeness: high  # entry, correction, per-report range, baseline/trend, PhenoAge trajectory, sync, FHIR, share, review, notify
      integration: medium  # server persistence + FHIR R4 + clinician view + notifications + canonical longitudinal state (labLongitudinalBridge -> useLongitudinalState -> What changed + Body Exposure 'Your data' per system + personal timeline); state is client-built only
      reliability: medium  # server validation, last-write-wins with 409, sync retry/backoff; single-node file/Mongo store
      usability: medium  # browser-verified at 390x844; no user testing
      clinical_quality: unknown  # formulas sourced (PhenoAge Levine 2018, MAD baseline); not clinically validated
      safety_security: medium  # requireAuth, verified-clinician role, consent grant + revoke + audit, no PHI in push text; no external security review
      observability_testing: medium  # uji gates with sabotage, server uji, HTTP probes, two-browser E2E; no production telemetry
    acceptance_evidence:
      - "process outcome definition lab-outcome-v1 (src/lib/hasilTerukurLab.ts): review coverage within 14 days, median days to review, recheck adherence; gate hasil-terukur-lab; clinical outcome measures still require a prospective protocol"
      - "gates: masukan-lab-terjaga, tren-lab-pribadi, trajektori-usia-biologis, lab-tersinkron, lab-fhir-dokter, rentang-rujukan-lab (scripts/uji)"
      - "server: server/uji/labLog.uji.ts, server/uji/labFhir.uji.ts"
      - "HTTP: own 200, other patient empty, stale write 409, future date 400; clinician granted 200 / other 404 / unverified 403 / after revoke 404"
      - "browser E2E 390x844: add->warn->save->delete; device A->B sync; share->clinician trend view->review->patient sees review"
      - "commits: 16608b5a 07813792 3fc91bf4 b237c432 88ba36ff 14aa0435 0beadc1c 5516e7d8 7926aee9 96de9684"
    known_gaps: [photo_ocr_import, direct_lab_system_integration, canonical_state_recomputed_per_view_not_cached, production_deployment_verification, prospective_clinician_validation]
    next_action: external_study_lead_confirms_thresholds_then_two_verified_clinicians_assess_30_cases  # process measures landed; protocol + clinical outcomes need owner (internship)
    last_audited_commit: 0cb6906a

  - workflow_id: care.daily_checkin
    name: Clinician-authored daily check-in to clinician digest
    strategic_priority: core
    maturity_level: FUNCTIONAL
    clinical_validation: none
    dimensions:
      functional_completeness: medium  # plan authoring, patient answers, kernel-recomputed priority; no measurement rules, reminders or offline queue in UI
      integration: medium  # shares consent/grant with lab sharing; not yet projected to longitudinal state or QuestionnaireResponse export
      reliability: medium
      usability: medium  # 2026-09-25: fixed the blank-panel-on-load-failure bug (see below), then closed the three remaining friction items found in the same pass: RencanaHarianDokter now validates diagnosis/question/lab-rule fields in the browser before calling the server, with wording mirrored from susunRencana()'s own errors (server/src/carePlan.ts), instead of surfacing a raw server error only after a round trip; "Start daily check-in" is now disabled and reads "Saving…" while simpan() is in flight, closing the double-submit hazard (no idempotency key on this path, unlike the daily-report queue); LabPasienUntukDokter's clinician-lab-share list now shows "Loading…" between mount and the first api.clinicianLabShares() response instead of an ambiguous blank section. None of this is a clinician/browser usability test with a real clinician.
      clinical_quality: unknown  # rules are clinician-authored only; app adds none
      safety_security: medium  # verified clinician + active grant; revoke stops check-in; 'not an emergency service' line
      observability_testing: medium  # rencana-harian-kontrak (server<->kernel contract + endpoint guards, sabotaged), browser E2E
    acceptance_evidence:
      - "gate: scripts/uji/rencana-harian-kontrak.mts (source-pattern sabotages fail by name: !data branch must show galat + retry; validasi() must reject non-numeric threshold / out-of-range result age / missing evidence reference; simpan() must call validasi() and refuse re-entry while mengirim; \"Start daily check-in\" must be disabled while mengirim; clinician lab-share list must show a Loading state before daftar resolves)"
      - "clinician-authored lab review rules (metric lab.<test>, >=/<=, threshold, max result age, evidence reference REQUIRED; verifiedBy/verifiedAt from server identity) evaluated by the kernel in the clinician browser over the shared canonical state; kernel age now from capturedAt (collection time), not receivedAt; gate aturan-lab-dokter (sabotage: receivedAt age fails); browser E2E 390x844: rule refused without evidence, then HbA1c 9.4 -> Meets your rule"
      - "browser E2E 390x844 (2026-09-25): answer offline -> queued, card says saved-not-sent; reconnect -> sent once, queue empty, no page errors; server holds 1 report with offline authoredAt. HTTP: same clientId x3 -> same report id, 1 stored"
      - "opt-in daily reminder (server/src/pengingatCek.ts): only with an active plan + valid grant and no report for the local date, user local time, once per day (server-owned guard), no PHI in text; server/uji/pengingatCek.uji.ts (sabotage: UTC date fails)"
      - "offline queue (src/lib/antreanCekHarian.ts): network failures queued on device and sent on reconnect, server rejections not queued; idempotent POST via clientId; offline authoredAt bounded to 7 days; gates antrean-cek-harian + server carePlanIdem (sabotaged)"
      - "FHIR R4 export GET /api/clinician/lab-shares/:id/care/fhir (Questionnaire + QuestionnaireResponse + Provenance, raw answers only); server/uji/carePlanFhir.uji.ts (sabotage: priorities leaked fails)"
      - "browser E2E: doctor plan -> patient 'yes' + 148 -> doctor 'Review today'"
      - "commits: dc95129a 0cb6906a"
    known_gaps: [reminder_live_push_verification, vital_sign_measurement_rules_need_device_or_verified_source, clinical_validation]
    next_action: clinician_usability_test_of_plan_authoring_and_digest  # longitudinal projection (careLongitudinalBridge), FHIR QuestionnaireResponse export, blank-panel-on-load-failure fix, lab-rule inline validation, lab-share loading state and check-in double-submit guard are all landed; a real qualified-clinician usability session is the remaining next step and cannot be fabricated in-repo
    last_audited_commit: bfd62e6

  - workflow_id: clinical.patient_review
    name: Longitudinal patient review to clinician-supported next action
    strategic_priority: core
    maturity_level: UNKNOWN
    clinical_validation: unknown
    dimensions:
      functional_completeness: unknown
      integration: unknown
      reliability: unknown
      usability: unknown
      clinical_quality: unknown
      safety_security: unknown
      observability_testing: unknown
    acceptance_evidence: []
    known_gaps: [requires_current_main_audit]
    next_action: audit_ai_emr_patient_state_reasoning_review_followup
    last_audited_commit: null

  - workflow_id: body.spatial_clinical_context
    name: Patient or educational context to spatial Body Exposure projection
    strategic_priority: core
    maturity_level: UNKNOWN
    clinical_validation: not_applicable
    dimensions:
      functional_completeness: unknown
