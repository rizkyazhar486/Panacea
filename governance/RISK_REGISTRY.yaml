  - risk_id: risk.clinical_calculator_input_validation
    category: clinical_safety
    severity: medium
    state: mitigated_in_part
    description: >-
      src/pages/ClinicalCalculators.tsx reads numeric fields with `+e.target.value` and its handlers had no finite or
      range check (48 counted on first review; 59 `+e.target.value` reads across 23 calculators when recounted on
      2026-10-03, which includes the nine since fixed). An empty field becomes 0 and a negative or out-of-range
      value is accepted, so a calculator can print Infinity, NaN or a plausible-looking number with a clinical stage
      label (reproduced on CKD-EPI: empty creatinine gave Infinity labelled G1 normal, negative creatinine gave NaN
      labelled G5 kidney failure). Outputs are decision-support displays, not orders, but a wrong stage is misleading.
    mitigation: >-
      2026-10-02: CKD-EPI now calls the validated egfrCkdEpi2021 (creatinine 0.1-25 mg/dL, age 18-120), shows the
      reason and no number when input is invalid, and derives the KDIGO stage from the unrounded value
      (scripts/uji/egfr-ckd-epi-2021.mts, with sabotage-checked tests). Parkland and the Burn calculator now share
      parklandVolumes (src/domains/clinical-calculators; weight 0.5-300 kg, %TBSA above 0 to 100, 2026-10-03;
      scripts/uji/parkland-volumes.mts). Remaining calculators are still unvalidated;
      fix them one at a time, dose/volume-like first (done 2026-10-03: PedsDoseCalc and HollidaySegarCalc through
      pedsDose/hollidaySegar, scripts/uji/peds-dose-holliday-segar.mts; the dose function is arithmetic only and
      deliberately invents no drug maximum; IvDripCalc and FluidBalanceCalc followed on 2026-10-03 through
      ivDrip/fluidBalance, scripts/uji/iv-drip-fluid-balance.mts). NaCorrectionCalc followed through
      correctedSodiumKatz/potassiumAssessment, scripts/uji/electrolyte-correction.mts, with the existing formulas and
      potassium severity thresholds moved unchanged and pinned at every boundary; an empty potassium field used to show
      a Severe badge). AbgCalc followed through interpretAbg, scripts/uji/blood-gas-interpretation.mts, with the stepwise logic and its
      text moved unchanged and the delta-ratio and Winter thresholds pinned at their boundaries; pH/PaCO2/HCO3
      consistency checking is deliberately not added because it would be a new clinical feature). MapCalc, BrocaCalc and BrocaLorentzCalorieCalc followed through meanArterialPressure/idealBodyWeight/dailyCalories,
      scripts/uji/map-ideal-body-weight.mts; Broca had been copied into two pages and is now one source, and the MAP
      thresholds are pinned at their boundaries. MidParentalCalc and McDonaldCalc followed through midParentalHeight/mcdonaldGestationalAge
      (scripts/uji/mid-parental-mcdonald.mts), formulas and constants unchanged; McDonald now refuses fundal heights
      outside the 20-36 cm range its own page text states. NaegeleCalc followed through naegele (scripts/uji/naegele-gestational-age.mts): UTC calendar arithmetic with an injected clock, real-date validation and a CORRECTED gestational-age sign (GA = 40w0d on the EDD for every cycle 20-60); this is a clinical output change that needs clinical sign-off. CentorCalc, ParadiseCalc and FletcherCalc followed through centorMcIsaac/paradiseCriteria/fletcherIndex
      (scripts/uji/centor-paradise-fletcher.mts) with every classification threshold moved unchanged and pinned at its
      boundary; Centor age and Fletcher thresholds now keep the raw field text so an empty field is rejected instead of
      being read as 0 (an empty Fletcher form used to show "Normal", an empty Centor age added a point, 1e999 episodes
      met the Paradise criteria). BallardSoapCalc and DenverCalc got input validation only (validateBallardInputs, validateDenverAge;
      scripts/uji/ballard-denver-inputs.mts): their reference tables, the Ballard-to-gestational-age interpolation, the
      Lubchenco percentiles, the SOAP text and the Denver milestone list are untouched. An empty 5-minute APGAR used to be
      read as 0 and made the auto-drafted SOAP note write "severe depression, needs further resuscitation & NICU
      referral"; the form now keeps raw text and refuses empty fields. WhoGrowthCalc, WhoNeonateCalc and CdcAnthropometryCalc got input validation only (validateWhoGrowthInputs,
      validateNeonateInputs, validateCdcInputs; scripts/uji/growth-inputs.mts): the computation and result JSX moved
      verbatim into child components rendered only for valid input (0 of 160 original lines missing; 13 of 13 valid input
      sets render identical text before and after, measured in a browser), the reference tables, interpolation,
      z-score and BMI classes and the masked-stunting, >10% loss and day-14 warnings are untouched. The old pages showed
      Infinity or NaN for an empty height, birth weight 0 and CDC age 1000. Inventory after this change (a scan of every
      type=number input, not only the +e.target.value pattern my first count used): 24 calculators take numeric
      input; all now go through a domain function including NaegeleCalc (clinical sign-off pending). SirirajCalc, the one my first count missed because it parsed with Number(e.target.value) || 0 (an empty
      diastolic pressure was read as 0 and showed a score of -12, "Suggests ISCHAEMIC stroke"), now goes through
      sirirajStrokeScore (scripts/uji/siriraj-stroke-score.mts): expression, +/-1 thresholds, labels, CT-scan warning
      and source are unchanged, and the float arithmetic is shown not to misclassify at the thresholds over 8664
      combinations. Noted, not changed: the Broca-Lorentz page
      text says 25 kcal/kg basal while the factors it applies are 30/35/40; that needs clinical-nutrition review, moving each formula into src/domains with its own
      positive and negative tests.
