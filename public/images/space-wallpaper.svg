<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1900" width="900" height="1900">
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#eefcf9" />
      <stop offset="45%" stop-color="#eef3fb" />
      <stop offset="100%" stop-color="#f6eefc" />
    </linearGradient>
    <!-- HEX persis dari referensi, dipimpin merah-api/jingga (bukan ungu)
         supaya tidak lagi terbaca "feminin" — flaming fire dulu, neon
         menyusul. -->
    <radialGradient id="fire" cx="10%" cy="8%" r="45%">
      <stop offset="0%" stop-color="#FF1A00" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF1A00" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ember" cx="90%" cy="10%" r="42%">
      <stop offset="0%" stop-color="#FF6600" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#FF6600" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyan" cx="94%" cy="88%" r="42%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gold" cx="85%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violet" cx="6%" cy="90%" r="44%">
      <stop offset="0%" stop-color="#9D00FF" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#9D00FF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="streak1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1A00" stop-opacity="0" />
      <stop offset="20%" stop-color="#FF6600" stop-opacity="0.6" />
      <stop offset="45%" stop-color="#FFD700" stop-opacity="0.65" />
      <stop offset="70%" stop-color="#00D2FF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#9D00FF" stop-opacity="0" />
    </linearGradient>
    <filter id="soften"><feGaussianBlur stdDeviation="16" /></filter>
    <filter id="softenMore"><feGaussianBlur stdDeviation="30" /></filter>
    <radialGradient id="glint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="900" height="1900" fill="url(#base)" />
  <rect width="900" height="1900" fill="url(#fire)" />
  <rect width="900" height="1900" fill="url(#ember)" />
  <rect width="900" height="1900" fill="url(#cyan)" />
  <rect width="900" height="1900" fill="url(#gold)" />
  <rect width="900" height="1900" fill="url(#violet)" />

  <!-- prism light streaks, echoing the reference mood -->
  <g filter="url(#soften)" opacity="0.8">
    <path d="M -100 420 C 200 380, 500 470, 1000 360" stroke="url(#streak1)" stroke-width="24" fill="none" stroke-linecap="round" />
    <path d="M -100 470 C 220 440, 520 520, 1000 410" stroke="url(#streak1)" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.6" />
  </g>
  <g filter="url(#softenMore)" opacity="0.45">
    <path d="M -100 1220 C 250 1280, 550 1140, 1000 1240" stroke="url(#streak1)" stroke-width="55" fill="none" stroke-linecap="round" />
  </g>

  <!-- sparse bright glints — a hint of stars that still reads on a light sky -->
  <circle cx="120" cy="180" r="3" fill="url(#glint)" />
  <circle cx="720" cy="90" r="2.4" fill="url(#glint)" />
  <circle cx="830" cy="300" r="3.4" fill="url(#glint)" />
  <circle cx="60" cy="640" r="2.4" fill="url(#glint)" />
  <circle cx="500" cy="70" r="2" fill="url(#glint)" />
  <circle cx="260" cy="900" r="3" fill="url(#glint)" />
  <circle cx="780" cy="1080" r="2.6" fill="url(#glint)" />
  <circle cx="140" cy="1380" r="3" fill="url(#glint)" />
  <circle cx="640" cy="1560" r="2.4" fill="url(#glint)" />
  <circle cx="400" cy="1750" r="3.2" fill="url(#glint)" />
</svg>
