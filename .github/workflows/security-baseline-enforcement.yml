name: Security Baseline Enforcement

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-enforcement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enforce security baseline
        run: node scripts/qa/security-baseline-enforcement.mjs

      - name: Upload security enforcement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-baseline-enforcement
          path: artifacts/security-baseline-enforcement.json
          if-no-files-found: error
          retention-days: 7
