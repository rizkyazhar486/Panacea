name: Body3D Progressive Rebase Guard

on:
  push:
    branches:
      - fix/body3d-progressive-rebased-20260908

permissions:
  contents: write

jobs:
  rebase-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[progressive-rebased]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout latest main-based branch
        uses: actions/checkout@v4
        with:
          ref: fix/body3d-progressive-rebased-20260908
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Reapply validated progressive-loading commits
        run: |
          git config user.name "Panacea Stabilization Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin 9a9ea98c7a3145d26898507be191ca0f34147813 3a0933da03fe3cf2d6157b00a5d9730874ecb23e f25e981f180aefd79fad80ecbb56bbff1b5eba3b
          git cherry-pick 9a9ea98c7a3145d26898507be191ca0f34147813
          git cherry-pick 3a0933da03fe3cf2d6157b00a5d9730874ecb23e
          git cherry-pick f25e981f180aefd79fad80ecbb56bbff1b5eba3b
          git diff --check HEAD~3..HEAD

      - name: Install dependencies
        run: npm ci

      - name: Frontend acceptance
        run: |
          npx tsc --noEmit
          npm run build
          npm run uji

      - name: Commit marker and push
        run: |
          git commit --allow-empty -m "fix(body): rebase progressive loading onto latest main [progressive-rebased]"
          git push origin HEAD:fix/body3d-progressive-rebased-20260908
