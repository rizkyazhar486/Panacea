name: Organ Exact Mesh Guard

on:
  push:
    branches:
      - feat/body-exposure-organ-detail-20260908

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[organ-exact-mesh-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/body-exposure-organ-detail-20260908

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded organ viewer patch
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          function once(path, oldText, newText, label) {
            let s = fs.readFileSync(path, 'utf8')
            const at = s.indexOf(oldText)
            if (at < 0) throw new Error(`${label}: expected block not found`)
            if (s.indexOf(oldText, at + oldText.length) >= 0) throw new Error(`${label}: block not unique`)
            s = s.slice(0, at) + newText + s.slice(at + oldText.length)
            fs.writeFileSync(path, s)
          }

          once(
            'src/components/OrganModel3D.tsx',
            `interface Props {\n  organ: OrganModel\n  /** Hotspot yang sedang dipilih, kalau ada. */\n  selected?: string | null\n  onSelect?: (hotspotId: string | null) => void\n}\n\nexport function OrganModel3D`,
            `interface Props {\n  organ: OrganModel\n  /** Hotspot id atau exact named mesh yang sedang dipilih. */\n  selected?: string | null\n  onSelect?: (hotspotIdOrMeshName: string | null) => void\n}\n\nfunction displayMeshName(name: string): string {\n  return name.replace(/_/g, ' ').replace(/\\s+/g, ' ').trim()\n}\n\nexport function OrganModel3D`,
            'readable exact mesh names',
          )

          once(
            'src/components/OrganModel3D.tsx',
            `  const [fatal, setFatal] = useState('')\n  // Posisi layar tiap hotspot`,
            `  const [fatal, setFatal] = useState('')\n  const [partNames, setPartNames] = useState<string[]>([])\n  const [showAllParts, setShowAllParts] = useState(false)\n  const [pickedMesh, setPickedMesh] = useState<string | null>(null)\n  // Posisi layar tiap hotspot`,
            'named part state',
          )

          once(
            'src/components/OrganModel3D.tsx',
            `  const onSelectRef = useRef(onSelect)\n  onSelectRef.current = onSelect\n\n  useEffect(() => {`,
            `  const onSelectRef = useRef(onSelect)\n  onSelectRef.current = onSelect\n  const selectedRef = useRef(selected)\n  selectedRef.current = selected\n\n  useEffect(() => {`,
            'selected ref',
          )

          once(
            'src/components/OrganModel3D.tsx',
            `    let group: THREE.Group | null = null\n    const loader = new GLTFLoader()`,
            `    let group: THREE.Group | null = null\n    const namedMeshes: THREE.Mesh[] = []\n    const originalEmissive = new Map<THREE.Mesh, THREE.Color>()\n    let highlighted: THREE.Mesh | null = null\n    const ray = new THREE.Raycaster()\n    const pointer = new THREE.Vector2()\n\n    const selectionName = (value?: string | null) => {\n      if (!value) return ''\n      return organ.hotspots.find((h) => h.id === value)?.ta ?? value\n    }\n    const applyHighlight = (value?: string | null) => {\n      if (highlighted) {\n        const material = highlighted.material as THREE.MeshStandardMaterial\n        const original = originalEmissive.get(highlighted)\n        if (original) material.emissive.copy(original)\n        highlighted = null\n      }\n      const wanted = selectionName(value).toLowerCase()\n      if (!wanted) return\n      const hit = namedMeshes.find((m) => String(m.userData.panaceaDisplayName ?? displayMeshName(m.name)).toLowerCase() === wanted)\n      if (!hit) return\n      const material = hit.material as THREE.MeshStandardMaterial\n      material.emissive.set(organ.accent).multiplyScalar(0.35)\n      highlighted = hit\n    }\n\n    const loader = new GLTFLoader()`,
            'exact mesh interaction state',
          )

          once(
            'src/components/OrganModel3D.tsx',
            `        group = gltf.scene\n        // Model dinormalkan ke ukuran & titik pusat yang sama, karena berkas`,
            `        group = gltf.scene\n        if (organ.sumber === 'bodyparts3d') {\n          const names: string[] = []\n          group.traverse((object) => {\n            if (!(object as THREE.Mesh).isMesh) return\n            const mesh = object as THREE.Mesh\n            if (!mesh.name || Array.isArray(mesh.material)) return\n            const material = (mesh.material as THREE.MeshStandardMaterial).clone()\n            mesh.material = material\n            const exactName = typeof mesh.userData.panaceaAnatomyName === 'string'\n              ? mesh.userData.panaceaAnatomyName\n              : displayMeshName(mesh.name)\n            mesh.userData.panaceaDisplayName = exactName\n            namedMeshes.push(mesh)\n            originalEmissive.set(mesh, material.emissive.clone())\n            names.push(exactName)\n          })\n          setPartNames([...new Set(names)].sort((a, b) => a.localeCompare(b)))\n        } else {\n          setPartNames([])\n        }\n        // Model dinormalkan ke ukuran & titik pusat yang sama, karena berkas`,
            'collect every verified organ mesh',
          )

          once(
            'src/components/OrganModel3D.tsx',
            `    const stopAuto = () => { controls.autoRotate = false }\n    renderer.domElement.addEventListener('pointerdown', stopAuto)\n\n    const v = new THREE.Vector3()`,
            `    const stopAuto = () => { controls.autoRotate = false }\n    renderer.domElement.addEventListener('pointerdown', stopAuto)\n\n    const pickNamedMesh = (ev: PointerEvent) => {\n      if (organ.sumber !== 'bodyparts3d' || !namedMeshes.length) return\n      const rect = renderer.domElement.getBoundingClientRect()\n      if (rect.width < 2 || rect.height < 2) return\n      pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1\n      pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1\n      ray.setFromCamera(pointer, camera)\n      const hit = ray.intersectObjects(namedMeshes, false)[0]?.object as THREE.Mesh | undefined\n      if (!hit) return\n      const name = String(hit.userData.panaceaDisplayName ?? displayMeshName(hit.name))\n      setPickedMesh(name)\n      onSelectRef.current?.(name)\n    }\n    renderer.domElement.addEventListener('pointerup', pickNamedMesh)\n\n    const v = new THREE.Vector3()`,
            'ray-pick verified organ meshes',
          )

          once(
            'src/components/OrganModel3D.tsx',
            `    let raf = 0\n    function animate() {\n      controls.update()`,
            `    let raf = 0\n    let previousSelection = ''\n    function animate() {\n      const currentSelection = selectionName(selectedRef.current)\n      if (currentSelection !== previousSelection) {\n        previousSelection = currentSelection\n        applyHighlight(currentSelection)\n        if (currentSelection) setPickedMesh(currentSelection)\n      }\n      controls.update()`,
            'selection-driven mesh highlight',
          )

          once(
            'src/components/OrganModel3D.tsx',
            `      renderer.domElement.removeEventListener('pointerdown', stopAuto)\n      controls.dispose()`,
            `      renderer.domElement.removeEventListener('pointerdown', stopAuto)\n      renderer.domElement.removeEventListener('pointerup', pickNamedMesh)\n      controls.dispose()`,
            'ray-pick cleanup',
          )

          once(
            'src/components/OrganModel3D.tsx',
            `  return (\n    <div className="relative h-[300px] w-full overflow-hidden rounded-2xl bg-gradient-to-b from-neutral-100 to-neutral-200 dark:from-neutral-900 dark:to-neutral-950">\n      <div ref={containerRef} className="h-full w-full touch-none" />`,
            `  const visibleParts = showAllParts ? partNames : partNames.slice(0, 12)\n  const selectedName = selected ? (organ.hotspots.find((h) => h.id === selected)?.ta ?? selected) : ''\n\n  return (\n    <div className="space-y-2">\n      <div className="relative h-[300px] w-full overflow-hidden rounded-2xl bg-gradient-to-b from-neutral-100 to-neutral-200 dark:from-neutral-900 dark:to-neutral-950">\n      <div ref={containerRef} className="h-full w-full touch-none" />`,
            'organ viewer wrapper',
          )

          once(
            'src/components/OrganModel3D.tsx',
            `      {!loading && !fatal && (\n        <p className="pointer-events-none absolute bottom-1.5 left-0 right-0 text-center text-[10px] text-neutral-500">\n          Drag to rotate · tap a marker to name the part\n        </p>\n      )}\n    </div>\n  )`,
            `      {!loading && !fatal && (\n        <p className="pointer-events-none absolute bottom-1.5 left-0 right-0 px-3 text-center text-[10px] text-neutral-500">\n          {pickedMesh ? pickedMesh : organ.sumber === 'bodyparts3d' ? 'Drag to rotate · tap any named reference structure' : 'Drag to rotate · tap a verified marker'}\n        </p>\n      )}\n      </div>\n\n      {organ.sumber === 'bodyparts3d' && partNames.length > 0 && (\n        <div className="rounded-xl border border-neutral-200 p-2.5 dark:border-white/10">\n          <div className="flex items-center justify-between gap-2">\n            <div>\n              <div className="text-[11px] font-bold text-ink dark:text-white">Named reference anatomy</div>\n              <p className="text-[10px] text-neutral-400">{partNames.length} source meshes in this close-up · BodyParts3D 4.0</p>\n            </div>\n            {partNames.length > 12 && (\n              <button\n                type="button"\n                onClick={() => setShowAllParts((v) => !v)}\n                className="shrink-0 rounded-full border border-neutral-200 px-2 py-1 text-[10px] font-bold text-neutral-600 dark:border-white/10 dark:text-neutral-300"\n              >\n                {showAllParts ? 'Show less' : `Show all ${partNames.length}`}\n              </button>\n            )}\n          </div>\n          <div className="mt-2 flex max-h-40 flex-wrap gap-1 overflow-y-auto">\n            {visibleParts.map((name) => (\n              <button\n                key={name}\n                type="button"\n                onClick={() => onSelectRef.current?.(selectedName === name ? null : name)}\n                className={\`rounded-full border px-2 py-1 text-[10px] font-semibold transition \${\n                  selectedName === name\n                    ? 'border-brand bg-brand text-white'\n                    : 'border-neutral-200 text-neutral-600 hover:border-brand/50 dark:border-white/10 dark:text-neutral-300'\n                }\`}\n              >\n                {name}\n              </button>\n            ))}\n          </div>\n          <p className="mt-2 text-[9.5px] leading-relaxed text-neutral-400">\n            These labels come from the named meshes stored in the reference GLB. Missing microscopic or segmental structures are not fabricated.\n          </p>\n        </div>\n      )}\n    </div>\n  )`,
            'all named parts UI',
          )

          once(
            'scripts/atlasGlb.mjs',
            `    nodes.push({ name: nama, mesh: meshes.length - 1 })`,
            `    nodes.push({ name: nama, mesh: meshes.length - 1, extras: { panaceaAnatomyName: nama } })`,
            'exact source name preservation in generated GLB',
          )
          NODE
          git diff --check

      - name: TypeScript and full deterministic tests
        run: |
          npx tsc --noEmit
          npm run uji

      - name: Commit validated source changes
        run: |
          git config user.name "Panacea Stabilization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/OrganModel3D.tsx scripts/atlasGlb.mjs
          git diff --cached --check
          git commit -m "feat(body): expose every named reference organ mesh [organ-exact-mesh-applied]"
          git push origin HEAD:feat/body-exposure-organ-detail-20260908
