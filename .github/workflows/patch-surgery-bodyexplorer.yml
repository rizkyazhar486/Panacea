name: Patch surgery shared-view callback

on:
  push:
    branches:
      - feat/surgery-integration-20260909

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/surgery-integration-20260909

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Guarded BodyExplorer patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/BodyExplorer.tsx')
          text = path.read_text()
          old = """                <SurgicalLab
                  onKedalaman={setDissect}
                  onSorot={(nama) => { setActiveWorkout(null); setActiveOrgan(null); setFocusKeywords(null); setHighlighted(nama) }}
                />"""
          new = """                <SurgicalLab
                  onKedalaman={setDissect}
                  onSorot={(nama) => { setActiveWorkout(null); setActiveOrgan(null); setFocusKeywords(null); setHighlighted(nama) }}
                  onSharedView={(view) => {
                    setRenderMode(view.renderMode)
                    setSlicePlane(view.slicePlane)
                    setSlicePos(view.slicePos)
                    setUnfold(view.unfold)
                  }}
                />"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one SurgicalLab mount, found {count}')
          path.write_text(text.replace(old, new))
          PY

      - name: Validate patched source
        run: |
          npm ci
          npx tsc --noEmit
          git diff --check
          grep -F "onSharedView={(view) =>" src/pages/BodyExplorer.tsx

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/patch-surgery-bodyexplorer.yml
          git config user.name panacea-surgery-bot
          git config user.email actions@users.noreply.github.com
          git add src/pages/BodyExplorer.tsx
          git commit -m "feat(surgery): connect simulator presets to shared Body3D"
          git push origin HEAD:feat/surgery-integration-20260909
