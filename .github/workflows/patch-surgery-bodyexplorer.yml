name: Patch surgery shared-view callback

on:
  push:
    branches:
      - feat/surgery-integration-20260909

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/surgery-integration-20260909

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Guarded BodyExplorer patch
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('src/pages/BodyExplorer.tsx')
          text = path.read_text()
          pattern = re.compile(
              r'(?m)^([ \t]*)<SurgicalLab\n'
              r'\1  onKedalaman=\{setDissect\}\n'
              r'\1  onSorot=\{\(nama\) => \{ setActiveWorkout\(null\); setActiveOrgan\(null\); setFocusKeywords\(null\); setHighlighted\(nama\) \}\}\n'
              r'\1/>$'
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one SurgicalLab mount, found {len(matches)}')

          match = matches[0]
          indent = match.group(1)
          replacement = (
              indent + '<SurgicalLab\n'
              + indent + '  onKedalaman={setDissect}\n'
              + indent + '  onSorot={(nama) => { setActiveWorkout(null); setActiveOrgan(null); setFocusKeywords(null); setHighlighted(nama) }}\n'
              + indent + '  onSharedView={(view) => {\n'
              + indent + '    setRenderMode(view.renderMode)\n'
              + indent + '    setSlicePlane(view.slicePlane)\n'
              + indent + '    setSlicePos(view.slicePos)\n'
              + indent + '    setUnfold(view.unfold)\n'
              + indent + '  }}\n'
              + indent + '/>'
          )
          updated = text[:match.start()] + replacement + text[match.end():]
          path.write_text(updated)
          PY

      - name: Validate patched source
        run: |
          npm ci
          npx tsc --noEmit
          git diff --check
          test "$(grep -Fc 'onSharedView={(view) =>' src/pages/BodyExplorer.tsx)" -eq 1

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/patch-surgery-bodyexplorer.yml
          git config user.name panacea-surgery-bot
          git config user.email actions@users.noreply.github.com
          git add src/pages/BodyExplorer.tsx
          git commit -m "feat(surgery): connect simulator presets to shared Body3D"
          git push origin HEAD:feat/surgery-integration-20260909
