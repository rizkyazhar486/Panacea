name: Vercel Prebuilt Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# This workflow is a fallback for Vercel remote-build rate limits.
# It builds on GitHub Actions, then uploads the prebuilt artifact to Vercel.
# Required repository secret: VERCEL_TOKEN
# Optional repository variables can continue to feed Vite at build time.

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@50

      - name: Verify Vercel credential is configured
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing repository secret VERCEL_TOKEN. Add it in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Link Panacea Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel link --yes --project=panacea --scope=panaceamed --token="$VERCEL_TOKEN"

      - name: Pull production environment and project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --scope=panaceamed --token="$VERCEL_TOKEN"

      # The expensive application build happens on the GitHub runner rather
      # than in Vercel's remote build queue. Vercel then receives .vercel/output.
      - name: Build production artifact locally
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_TURN_URL: ${{ vars.VITE_TURN_URL }}
          VITE_TURN_USER: ${{ vars.VITE_TURN_USER }}
          VITE_TURN_CRED: ${{ vars.VITE_TURN_CRED }}
        run: vercel build --prod --scope=panaceamed --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifact to production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(vercel deploy --prebuilt --prod --archive=tgz --scope=panaceamed --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $URL"

      - name: Deployment summary
        run: |
          echo "## Vercel production" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
