name: Vercel Prebuilt Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Fallback for Vercel remote-build rate limits.
# The application is built on GitHub Actions and the Build Output API artifact
# is uploaded to Vercel. Production secrets belong in Vercel Environment
# Variables; do not mirror TURN credentials into ordinary GitHub variables.
# Required GitHub repository secret: VERCEL_TOKEN

permissions:
  contents: read

# Only the newest main commit should reach production. In normal development a
# single feature is often committed as several small files within a short burst.
# Without a settling window each completed intermediate run consumes one Vercel
# deployment and can exhaust the free daily deployment quota even though only
# the final commit matters. cancel-in-progress + the short coalescing delay means
# a newer push cancels the older run before it uploads anything to Vercel.
concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Coalesce rapid main pushes
        if: github.event_name == 'push'
        run: sleep 90

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@50

      - name: Verify Vercel credential is configured
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing repository secret VERCEL_TOKEN. Add it in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Link Panacea Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel link --yes --project=panacea --scope=panaceamed --token="$VERCEL_TOKEN"

      - name: Pull production environment and project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --scope=panaceamed --token="$VERCEL_TOKEN"

      # `vercel pull` writes the production environment into .vercel locally.
      # VITE_API_URL is public and may still be overridden by a GitHub variable;
      # TURN credentials and other secrets must stay in Vercel Production env.
      - name: Build production artifact on GitHub runner
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: vercel build --prod --scope=panaceamed --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifact to production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(vercel deploy --prebuilt --prod --archive=tgz --scope=panaceamed --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $URL"

      - name: Smoke-test deployed production artifact
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          test -n "$DEPLOYMENT_URL"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 --max-time 30 "$DEPLOYMENT_URL" >/dev/null
          echo "Deployment responded successfully: $DEPLOYMENT_URL"

      - name: Deployment summary
        run: |
          echo "## Vercel production" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Alias: https://www.panaceamed.id" >> "$GITHUB_STEP_SUMMARY"
          echo "Smoke test: passed" >> "$GITHUB_STEP_SUMMARY"
