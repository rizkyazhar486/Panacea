name: Body 3D Render Acceptance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: body-3d-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Install browser smoke runner
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            if grep -q 'dl.google.com/linux/chrome-stable' "$source"; then
              sudo mv "$source" "$source.panacea-disabled"
            fi
          done
          npx playwright install --with-deps chromium

      - name: Start production preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/panacea-organ-preview.log 2>&1 &
          echo $! > /tmp/panacea-organ-preview.pid
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/panacea-organ-preview.log
          exit 1

      # Kedelapan gerbang dijalankan terhadap SATU build dan SATU preview.
      #
      # Sebelumnya hanya qa:organ-3d yang berjalan di CI, sementara tujuh gerbang
      # lain hanya ada di mesin pengembang -- artinya mereka tidak menjaga main
      # sama sekali. Panel organ gagal untuk sembilan model justru karena ia
      # satu-satunya permukaan 3D tanpa gerbang; membiarkan tujuh gerbang tidak
      # pernah berjalan adalah bentuk lain dari lubang yang sama.
      #
      # Dijalankan berurutan, bukan paralel: WebGL di sini memakai SwiftShader,
      # dan beberapa adegan sekaligus saling berebut CPU sampai salah satunya
      # habis waktu karena kelambatan, bukan karena cacat.
      - name: Prove every 3D panel renders
        env:
          ORGAN3D_QA_URL: http://127.0.0.1:4173/#/body-explorer
          WILAYAH3D_QA_URL: http://127.0.0.1:4173/#/body-explorer
          VENT3D_QA_URL: http://127.0.0.1:4173/#/body-explorer
          ARTERI3D_QA_URL: http://127.0.0.1:4173/#/body-explorer
          LIMFE3D_QA_URL: http://127.0.0.1:4173/#/body-explorer
          KERANGKA3D_QA_URL: http://127.0.0.1:4173/#/body-explorer
          LESI3D_QA_URL: http://127.0.0.1:4173/#/body-explorer
          KELENJAR3D_QA_URL: http://127.0.0.1:4173/#/body-explorer
        run: |
          set -e
          gagal=""
          for gerbang in qa:organ-3d qa:wilayah-3d qa:ventilasi-3d qa:arteri-3d \
                         qa:limfe-3d qa:kerangka-3d qa:lesi-3d qa:kelenjar-3d; do
            echo "::group::$gerbang"
            if npm run "$gerbang"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::$gerbang gagal"
              gagal="$gagal $gerbang"
            fi
          done
          if [ -n "$gagal" ]; then
            echo "Gerbang 3D yang gagal:$gagal"
            exit 1
          fi

      - name: Stop production preview
        if: always()
        run: |
          if [ -f /tmp/panacea-organ-preview.pid ]; then
            kill "$(cat /tmp/panacea-organ-preview.pid)" 2>/dev/null || true
          fi
