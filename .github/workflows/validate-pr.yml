name: Validate changes

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'panacea-maturity/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Architecture boundaries (new violations only)
        run: npm run lint:arsitektur
      - name: Architecture ratchet (flat lib freeze + lib purity)
        run: npm run lint:ratchet
      - name: Typecheck and production build
        run: npm run build
      - name: Deterministic offline tests
        run: npm run uji
      # ENG-D7-03 (landmark rig + kontrol landmark hilang/bergeser) dan ENG-D8-03 (catatan sumber primer per kelas lisensi):
      # sebelumnya hanya dijalankan lokal, sehingga tidak ada run CI yang bisa dikutip sebagai bukti.
      - name: Body Exposure rig landmarks and licence primary sources (ENG-D7-03, ENG-D8-03)
        run: |
          node --test scripts/qa/compare-blender-gait-contact.test.mjs scripts/qa/glb-add-foot-landmarks.test.mjs scripts/qa/licence-primary-sources.test.mjs scripts/qa/gait-contact-probe.test.mjs
          node scripts/qa/glb-provenance-audit.mjs

  server-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install shared root dependencies
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Server TypeScript
        working-directory: server
        run: npm run typecheck

      - name: Server build
        working-directory: server
        run: npm run build

      - name: Full deterministic server tests
        working-directory: server
        run: npm run uji
