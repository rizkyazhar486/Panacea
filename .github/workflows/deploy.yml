name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The offline test runner uses Node's TypeScript transform support
          # (`--experimental-transform-types`). Node 20 rejects that flag and
          # makes every .mts test fail before its code starts, so CI must use a
          # runtime that actually supports the repository's test contract.
          node-version: 24
          cache: npm
      - run: npm ci
      # Regression suite is intentionally offline/no-browser. Run it before
      # producing a deployable artifact so parser/cache/analytics regressions
      # cannot silently reach GitHub Pages.
      - run: npm run uji
      # Set repo variable VITE_API_URL (Settings → Secrets and variables →
      # Actions → Variables) to your deployed backend URL to enable live mode.
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # Optional — for video call (#10) to work on mobile data, set these
          # repo variables to your TURN server (see PANDUAN-SETUP.md Bagian Video).
          VITE_TURN_URL: ${{ vars.VITE_TURN_URL }}
          VITE_TURN_USER: ${{ vars.VITE_TURN_USER }}
          VITE_TURN_CRED: ${{ vars.VITE_TURN_CRED }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4