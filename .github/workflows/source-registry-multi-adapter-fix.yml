name: Source Registry Multi-Adapter Fix

on:
  push:
    branches:
      - fix/source-registry-multi-adapter-20260908
    paths:
      - scripts/stabilization/apply-source-registry-multi-adapter.mjs
      - .github/workflows/source-registry-multi-adapter-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/source-registry-multi-adapter-20260908
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply strict schema/validator patch
        run: node scripts/stabilization/apply-source-registry-multi-adapter.mjs
      - name: Install dependencies
        run: npm ci
      - name: Validate Source Registry
        run: npm run validate:source-registry
      - name: Source Registry deterministic tests
        run: npm run test:source-registry
      - name: Production build
        run: npm run build
      - name: Full deterministic suite
        run: npm run uji
      - name: Commit validated product changes only
        run: |
          rm -f scripts/stabilization/apply-source-registry-multi-adapter.mjs
          rm -f .github/workflows/source-registry-multi-adapter-fix.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No validated product changes to commit"
            exit 1
          fi
          git config user.name "panacea-stabilization-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(registry): support multiple validated adapter modules"
          git push origin HEAD:fix/source-registry-multi-adapter-20260908
