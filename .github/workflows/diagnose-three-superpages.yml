name: Diagnose three superpages

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Stage · note index
        continue-on-error: true
        run: node scripts/gen-note-index.mjs --check
      - name: Stage · source registry
        continue-on-error: true
        run: node scripts/validate-source-registry.mjs
      - name: Stage · feature factory
        continue-on-error: true
        run: node scripts/validate-feature-factory.mjs
      - name: Stage · academic review
        continue-on-error: true
        run: node scripts/validate-academic-review.mjs
      - name: Stage · embedded build QA
        continue-on-error: true
        run: node --test scripts/qa/source-registry-validator.test.mjs scripts/qa/feature-factory.test.mjs scripts/qa/academic-review-gate.test.mjs scripts/qa/home-widget-theme.test.mjs scripts/qa/compact-product-surface.test.mjs
      - name: Stage · TypeScript
        continue-on-error: true
        run: npx tsc -b
      - name: Stage · Vite
        continue-on-error: true
        run: npx vite build
