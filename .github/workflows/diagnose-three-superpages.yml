name: Diagnose three superpages

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture exact npm build
        id: exact-build
        shell: bash
        run: |
          set +e
          npm run build > /tmp/panacea-build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish diagnostic tail on this PR
        if: steps.exact-build.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '<!-- panacea-build-diagnostic -->'
            echo 'Temporary exact `npm run build` diagnostic:'
            echo '```text'
            tail -n 120 /tmp/panacea-build.log
            echo '```'
          } > /tmp/panacea-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/panacea-comment.md
      - name: Exact build result
        if: steps.exact-build.outputs.exit_code != '0'
        run: exit 1
