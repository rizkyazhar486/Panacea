name: MCP index safety check

on:
  push:
    branches:
      - tmp-mcp-patch-safety-check-final2
    paths:
      - '.github/workflows/mcp-index-safety.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: tmp-mcp-patch-safety-check-final2
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Apply deterministic index wiring patch
        run: node scripts/apply-mcp-index-wiring.mjs

      - name: Verify patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "server/src/index.ts"
          git diff -- server/src/index.ts

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: MCP targeted verification
        working-directory: server
        run: npm run uji:mcp

      - name: Server typecheck
        working-directory: server
        run: npm run typecheck

      - name: Commit verified isolated tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/src/index.ts
          git rm scripts/apply-mcp-index-wiring.mjs .github/workflows/mcp-index-safety.yml
          git commit -m 'fix(mcp): mount before global json parser'
          git push origin HEAD:tmp-mcp-patch-safety-check-final2
