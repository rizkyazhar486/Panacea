# Redundant wake path for the free notification server.
#
# GitHub scheduled workflows are best-effort and can occasionally skip or delay
# a run without producing a job failure. The primary wake workflow runs every
# ten minutes during the app's active WIB window; this second workflow is
# staggered by five minutes and has its own concurrency group.
#
# It reads the exact same repository variables/secrets as bangunkan-server.yml:
# SERVER_URL first, then VITE_API_URL. No second endpoint configuration is
# required. A missing endpoint exits successfully rather than creating noisy
# failures every few minutes.

name: Bangunkan server (cadangan)

on:
  schedule:
    # 04.05-22.55 WIB, staggered five minutes from the primary schedule.
    - cron: '5-55/10 21-23,0-16 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bangunkan-server-cadangan
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ops/wake-server.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Sentuh /api/health
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
          SERVER_URL_SECRET: ${{ secrets.SERVER_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_API_URL_SECRET: ${{ secrets.VITE_API_URL }}
        run: bash scripts/ops/wake-server.sh once
