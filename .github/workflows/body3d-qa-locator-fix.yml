name: Body3D QA Locator Fix

on:
  push:
    branches:
      - fix/body3d-progressive-loading-20260908

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[qa-locator-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/body3d-progressive-loading-20260908

      - name: Correct locator with exact guard
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'scripts/qa/body3d-mobile-smoke.mjs'
          let s = fs.readFileSync(path, 'utf8')
          const oldText = `  await progressiveLoading.waitFor({ state: 'visible', timeout: 5_000 })\n  await canvas.scrollIntoViewIfNeeded()\n  const progressiveOverlay = progressiveLoading.locator('xpath=ancestor::*[@role="status"][1]')\n  const progressiveClass = await progressiveOverlay.getAttribute('class')`
          const newText = `  await progressiveLoading.waitFor({ state: 'visible', timeout: 5_000 })\n  await canvas.scrollIntoViewIfNeeded()\n  // Resolve the live region directly. Chaining an ancestor XPath from a text\n  // locator can lose the element once React updates the text node during\n  // progress; filtering the stable status container is deterministic.\n  const progressiveOverlay = page.locator('[role="status"]').filter({ hasText: 'Adding anatomy layer…' }).first()\n  await progressiveOverlay.waitFor({ state: 'visible', timeout: 5_000 })\n  const progressiveClass = await progressiveOverlay.getAttribute('class')`
          const first = s.indexOf(oldText)
          if (first < 0) throw new Error('expected progressive locator block not found')
          if (s.indexOf(oldText, first + oldText.length) >= 0) throw new Error('progressive locator block is not unique')
          s = s.slice(0, first) + newText + s.slice(first + oldText.length)
          fs.writeFileSync(path, s)
          NODE
          node --check scripts/qa/body3d-mobile-smoke.mjs
          git diff --check

      - name: Commit corrected QA
        run: |
          git config user.name "Panacea Stabilization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/qa/body3d-mobile-smoke.mjs
          git commit -m "test(body): make progressive loading locator stable [qa-locator-fixed]"
          git push origin HEAD:fix/body3d-progressive-loading-20260908
