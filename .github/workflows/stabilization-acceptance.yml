name: Stabilization Acceptance

on:
  push:
    branches:
      - main
      - stabilization/integrate-body3d-20260908
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stabilization-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the expensive browser/WebGL acceptance on one runner so the production
  # build is reused by both Body smoke checks. `npm run build` already executes
  # repository validators plus `tsc -b`, so a separate frontend `tsc --noEmit`
  # only repeated the same type gate on every PR.
  full-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend production build and TypeScript
        run: npm run build

      - name: Frontend tests
        run: npm run uji

      - name: Install mobile browser smoke runner
        timeout-minutes: 8
        run: |
          set -euo pipefail
          PW_PREFIX="${RUNNER_TEMP}/panacea-playwright"
          mkdir -p "$PW_PREFIX"
          printf '%s\n' '{"private":true}' > "$PW_PREFIX/package.json"

          installed=''
          for attempt in 1 2 3; do
            if npm install \
              --prefix "$PW_PREFIX" \
              --no-save \
              --package-lock=false \
              --no-audit \
              --no-fund \
              @playwright/test@1.55.0; then
              installed='yes'
              break
            fi
            if [ "$attempt" = '3' ]; then
              echo "Playwright smoke-runner install failed after $attempt attempts." >&2
              exit 1
            fi
            echo "Playwright install attempt $attempt failed; retrying isolated install." >&2
            sleep $((attempt * 5))
          done
          test "$installed" = 'yes'

          mkdir -p node_modules/@playwright
          rm -rf node_modules/@playwright/test
          ln -s "$PW_PREFIX/node_modules/@playwright/test" node_modules/@playwright/test

          # GitHub's Ubuntu runner can include the unrelated Google Chrome apt
          # source. A transient checksum mismatch there must not block Playwright
          # Chromium's own system-dependency installation.
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            if grep -q 'dl.google.com/linux/chrome-stable' "$source"; then
              echo "Disabling unrelated Google Chrome apt source: $source"
              sudo mv "$source" "$source.panacea-disabled"
            fi
          done
          "$PW_PREFIX/node_modules/.bin/playwright" install --with-deps chromium

      - name: Start frontend preview
        run: |
          nohup setsid npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/panacea-vite-preview.log 2>&1 &
          echo $! > /tmp/panacea-vite-preview.pid
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/panacea-vite-preview.log
          exit 1

      - name: UI legibility ratchet 390x844
        env:
          UI_LEGIBILITY_ORIGIN: http://127.0.0.1:4173
        run: node scripts/qa/ui-legibility-ratchet.mjs

      - name: Body Exposure mobile 390x844 smoke
        env:
          BODY3D_QA_URL: http://127.0.0.1:4173/#/body-explorer?folds=open
          BODY3D_QA_SCREENSHOT: artifacts/body3d-mobile-390x844.png
          BODY3D_QA_METRICS: artifacts/body3d-mobile-metrics.json
        run: node scripts/qa/body3d-mobile-smoke-v2.mjs

      - name: Body Exposure rendered WebGL visual artifact
        env:
          BODY3D_QA_URL: http://127.0.0.1:4173/#/body-explorer?folds=open
          BODY3D_QA_CANVAS_ARTIFACT: artifacts/body3d-mobile-canvas.png
        run: node scripts/qa/body3d-canvas-artifact.mjs

      - name: Respiratory gas budget mobile interaction smoke
        run: node scripts/qa/alveolar-gas-budget-smoke.mjs

      - name: Panacea OS Daily mobile 390x844 smoke
        env:
          PANACEA_OS_QA_URL: http://127.0.0.1:4173/#/harian
          PANACEA_OS_QA_SCREENSHOT: artifacts/panacea-os-mobile-390x844.png
          PANACEA_OS_QA_METRICS: artifacts/panacea-os-mobile-metrics.json
        run: node scripts/qa/panacea-os-mobile-smoke.mjs

      - name: Poli patient identity and temporal mobile smoke
        run: node scripts/qa/poli-patient-temporal-smoke.mjs

      - name: Priority 2 UI/UX mobile 320x568 smoke
        env:
          UIUX_MOBILE_QA_ORIGIN: http://127.0.0.1:4173
          UIUX_MOBILE_QA_WIDTH: '320'
          UIUX_MOBILE_QA_HEIGHT: '568'
          UIUX_MOBILE_QA_DIR: artifacts/uiux-mobile-320x568
        run: node scripts/qa/uiux-mobile-shell-smoke.mjs

      - name: Priority 2 UI/UX mobile 390x844 smoke
        env:
          UIUX_MOBILE_QA_ORIGIN: http://127.0.0.1:4173
          UIUX_MOBILE_QA_DIR: artifacts/uiux-mobile-390x844
        run: node scripts/qa/uiux-mobile-shell-smoke.mjs

      - name: Priority 2 UI/UX mobile 430x932 smoke
        env:
          UIUX_MOBILE_QA_ORIGIN: http://127.0.0.1:4173
          UIUX_MOBILE_QA_WIDTH: '430'
          UIUX_MOBILE_QA_HEIGHT: '932'
          UIUX_MOBILE_QA_DIR: artifacts/uiux-mobile-430x932
        run: node scripts/qa/uiux-mobile-shell-smoke.mjs

      - name: Priority 2 UI/UX mobile landscape 844x390 smoke
        env:
          UIUX_MOBILE_QA_ORIGIN: http://127.0.0.1:4173
          UIUX_MOBILE_QA_WIDTH: '844'
          UIUX_MOBILE_QA_HEIGHT: '390'
          UIUX_MOBILE_QA_DIR: artifacts/uiux-mobile-844x390
        run: node scripts/qa/uiux-mobile-shell-smoke.mjs

      - name: Mobile parent query and history boundary
        env:
          NAVIGATION_QA_ORIGIN: http://127.0.0.1:4173
          NAVIGATION_QA_OUTPUT: artifacts/uiux-mobile-390x844
        run: node scripts/qa/navigation-back-smoke.mjs

      - name: Upload Body Exposure mobile QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: body3d-mobile-qa
          path: artifacts/body3d-mobile-*
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Panacea OS mobile QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panacea-os-mobile-qa
          path: artifacts/panacea-os-mobile-*
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Priority 2 UI/UX mobile QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uiux-mobile-responsive-matrix
          path: artifacts/uiux-mobile-*/*
          if-no-files-found: warn
          retention-days: 7

      - name: Stop frontend preview
        if: always()
        run: |
          if [ -f /tmp/panacea-vite-preview.pid ]; then
            preview_pid="$(cat /tmp/panacea-vite-preview.pid)"
            kill -TERM -- "-$preview_pid" 2>/dev/null || kill -TERM "$preview_pid" 2>/dev/null || true
            sleep 1
            kill -KILL -- "-$preview_pid" 2>/dev/null || true
          fi

  # Server acceptance is independent of the browser/WebGL runner. Some backend
  # regression tests intentionally import shared root React/TSX modules, so this
  # runner installs both lockfile graphs before executing the same server
  # typecheck/build/test suite. GitHub can run both acceptance jobs in parallel.
  server-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install shared root dependencies
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Server TypeScript
        working-directory: server
        run: npm run typecheck

      - name: Server build
        working-directory: server
        run: npm run build

      - name: Server tests
        working-directory: server
        run: npm run uji
