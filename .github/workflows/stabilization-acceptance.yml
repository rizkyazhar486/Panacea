name: Stabilization Acceptance

on:
  push:
    branches:
      - main
      - stabilization/integrate-body3d-20260908
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stabilization-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the expensive browser/WebGL acceptance on one runner so the production
  # build is reused by both Body smoke checks. `npm run build` already executes
  # repository validators plus `tsc -b`, so a separate frontend `tsc --noEmit`
  # only repeated the same type gate on every PR.
  full-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend production build and TypeScript
        run: npm run build

      # On pull requests `Validate changes` already runs the identical `npm run uji` on the same SHA,
      # so repeating it here only lengthens the task. Pushes to main (no PR validate run) still execute it.
      - name: Frontend tests
        if: github.event_name != 'pull_request'
        run: npm run uji

      - name: Install mobile browser smoke runner
        timeout-minutes: 8
        run: |
          set -euo pipefail
          PW_PREFIX="${RUNNER_TEMP}/panacea-playwright"
          mkdir -p "$PW_PREFIX"
          printf '%s\n' '{"private":true}' > "$PW_PREFIX/package.json"

          installed=''
          for attempt in 1 2 3; do
            if npm install \
              --prefix "$PW_PREFIX" \
              --no-save \
              --package-lock=false \
              --no-audit \
              --no-fund \
              @playwright/test@1.55.0; then
              installed='yes'
              break
            fi
            if [ "$attempt" = '3' ]; then
              echo "Playwright smoke-runner install failed after $attempt attempts." >&2
              exit 1
            fi
            echo "Playwright install attempt $attempt failed; retrying isolated install." >&2
            sleep $((attempt * 5))
          done
          test "$installed" = 'yes'

          mkdir -p node_modules/@playwright
          rm -rf node_modules/@playwright/test
          ln -s "$PW_PREFIX/node_modules/@playwright/test" node_modules/@playwright/test

          # GitHub's Ubuntu runner can include the unrelated Google Chrome apt
          # source. A transient checksum mismatch there must not block Playwright
          # Chromium's own system-dependency installation.
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            if grep -q 'dl.google.com/linux/chrome-stable' "$source"; then
              echo "Disabling unrelated Google Chrome apt source: $source"
              sudo mv "$source" "$source.panacea-disabled"
            fi
          done
          "$PW_PREFIX/node_modules/.bin/playwright" install --with-deps chromium

      - name: Start frontend preview
        run: |
          nohup setsid npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/panacea-vite-preview.log 2>&1 &
          echo $! > /tmp/panacea-vite-preview.pid
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/panacea-vite-preview.log
          exit 1

      - name: UI legibility ratchet 390x844
        env:
          UI_LEGIBILITY_ORIGIN: http://127.0.0.1:4173
        run: node scripts/qa/ui-legibility-ratchet.mjs

      - name: Body Exposure mobile 390x844 smoke
        env:
          BODY3D_QA_URL: http://127.0.0.1:4173/#/body-explorer?folds=open
          BODY3D_QA_SCREENSHOT: artifacts/body3d-mobile-390x844.png
          BODY3D_QA_METRICS: artifacts/body3d-mobile-metrics.json
        run: node scripts/qa/body3d-mobile-smoke-v2.mjs

      - name: OpenCell failed-source recovery
        run: node scripts/qa/opencell-load-recovery-smoke.mjs

      - name: Body Exposure rendered WebGL visual artifact
        env:
          BODY3D_QA_URL: http://127.0.0.1:4173/#/body-explorer?folds=open
          BODY3D_QA_CANVAS_ARTIFACT: artifacts/body3d-mobile-canvas.png
        run: node scripts/qa/body3d-canvas-artifact.mjs

      - name: Respiratory gas budget mobile interaction smoke
        run: node scripts/qa/alveolar-gas-budget-smoke.mjs

      - name: Panacea OS Daily mobile 390x844 smoke
        env:
          PANACEA_OS_QA_URL: http://127.0.0.1:4173/#/harian
          PANACEA_OS_QA_SCREENSHOT: artifacts/panacea-os-mobile-390x844.png
          PANACEA_OS_QA_METRICS: artifacts/panacea-os-mobile-metrics.json
        run: node scripts/qa/panacea-os-mobile-smoke.mjs

      - name: Poli patient identity and temporal mobile smoke
        run: node scripts/qa/poli-patient-temporal-smoke.mjs

      - name: Priority 2 UI/UX mobile 320x568 smoke
        env:
          UIUX_MOBILE_QA_ORIGIN: http://127.0.0.1:4173
          UIUX_MOBILE_QA_WIDTH: '320'
          UIUX_MOBILE_QA_HEIGHT: '568'
          UIUX_MOBILE_QA_DIR: artifacts/uiux-mobile-320x568
        run: node scripts/qa/uiux-mobile-shell-smoke.mjs

      - name: Priority 2 UI/UX mobile 390x844 smoke
        env:
          UIUX_MOBILE_QA_ORIGIN: http://127.0.0.1:4173
          UIUX_MOBILE_QA_DIR: artifacts/uiux-mobile-390x844
        run: node scripts/qa/uiux-mobile-shell-smoke.mjs

      - name: Priority 2 UI/UX mobile 430x932 smoke
        env:
          UIUX_MOBILE_QA_ORIGIN: http://127.0.0.1:4173
          UIUX_MOBILE_QA_WIDTH: '430'
          UIUX_MOBILE_QA_HEIGHT: '932'
          UIUX_MOBILE_QA_DIR: artifacts/uiux-mobile-430x932
        run: node scripts/qa/uiux-mobile-shell-smoke.mjs

      - name: Priority 2 UI/UX mobile landscape 844x390 smoke
        env:
          UIUX_MOBILE_QA_ORIGIN: http://127.0.0.1:4173
          UIUX_MOBILE_QA_WIDTH: '844'
          UIUX_MOBILE_QA_HEIGHT: '390'
          UIUX_MOBILE_QA_DIR: artifacts/uiux-mobile-844x390
        run: node scripts/qa/uiux-mobile-shell-smoke.mjs

      - name: Mobile parent query and history boundary
        env:
          NAVIGATION_QA_ORIGIN: http://127.0.0.1:4173
          NAVIGATION_QA_OUTPUT: artifacts/uiux-mobile-390x844
        run: node scripts/qa/navigation-back-smoke.mjs

      - name: C2 Framingham missing-input recovery (390x844)
        timeout-minutes: 5
        env:
          HEALTH_SIMULATOR_QA_ORIGIN: http://127.0.0.1:4173
          HEALTH_SIMULATOR_QA_OUTPUT: artifacts/health-simulator-inputs
        run: node scripts/qa/health-simulator-input-smoke.mjs

      - name: Upload Framingham input recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framingham-input-recovery
          path: artifacts/health-simulator-inputs
          if-no-files-found: ignore

      - name: C2 autophagy missing-input recovery (390x844)
        timeout-minutes: 5
        env:
          AUTOPHAGY_QA_ORIGIN: http://127.0.0.1:4173
          AUTOPHAGY_QA_OUTPUT: artifacts/autophagy-inputs
        run: node scripts/qa/autophagy-input-smoke.mjs

      - name: Upload autophagy input recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autophagy-input-recovery
          path: artifacts/autophagy-inputs
          if-no-files-found: ignore

      - name: Clinical validation claim-count input guard (synthetic client fixture, 390x844)
        timeout-minutes: 5
        env:
          CLAIM_COUNT_QA_ORIGIN: http://127.0.0.1:4173
          CLAIM_COUNT_QA_OUTPUT: artifacts/claim-count-inputs
        run: node scripts/qa/claim-count-input-smoke.mjs

      - name: Upload claim-count client input evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-count-client-input-guard
          path: artifacts/claim-count-inputs
          if-no-files-found: ignore

      - name: C2 nutrition missing-input recovery (390x844)
        timeout-minutes: 5
        env:
          NUTRITION_QA_ORIGIN: http://127.0.0.1:4173
          NUTRITION_QA_OUTPUT: artifacts/nutrition-inputs
        run: node scripts/qa/nutrition-input-smoke.mjs

      - name: Upload nutrition input recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nutrition-input-recovery
          path: artifacts/nutrition-inputs
          if-no-files-found: ignore

      - name: Upload price client input guards (390x844)
        timeout-minutes: 5
        env:
          UPLOAD_PRICE_QA_ORIGIN: http://127.0.0.1:4173
          UPLOAD_PRICE_QA_OUTPUT: artifacts/upload-price-inputs
        run: node scripts/qa/upload-price-input-smoke.mjs

      - name: Upload price input guard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-price-client-input-guard
          path: artifacts/upload-price-inputs
          if-no-files-found: ignore

      - name: Body Toolkit account-isolated storage (synthetic client, 390x844)
        timeout-minutes: 5
        env:
          BODY_TOOLKIT_QA_ORIGIN: http://127.0.0.1:4173
          BODY_TOOLKIT_QA_OUTPUT: artifacts/body-toolkit-storage
        run: node scripts/qa/body-toolkit-storage-smoke.mjs

      - name: Upload Body Toolkit isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: body-toolkit-storage-isolation
          path: artifacts/body-toolkit-storage
          if-no-files-found: ignore

      - name: Genome campaign missing-count and precision guards (synthetic client, 390x844)
        timeout-minutes: 5
        env:
          GENOME_CAMPAIGN_QA_ORIGIN: http://127.0.0.1:4173
          GENOME_CAMPAIGN_QA_OUTPUT: artifacts/genome-campaign-inputs
        run: node scripts/qa/genome-campaign-input-smoke.mjs

      - name: Upload Genome campaign input evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genome-campaign-input-guard
          path: artifacts/genome-campaign-inputs
          if-no-files-found: ignore

      - name: Carbon Diet missing-input and account isolation (synthetic client, 390x844)
        timeout-minutes: 5
        env:
          CARBON_DIET_QA_ORIGIN: http://127.0.0.1:4173
          CARBON_DIET_QA_OUTPUT: artifacts/carbon-diet-inputs
        run: node scripts/qa/carbon-diet-input-smoke.mjs

      - name: Upload Carbon Diet input evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carbon-diet-input-isolation
          path: artifacts/carbon-diet-inputs
          if-no-files-found: ignore

      - name: Strength cache ownership (synthetic client, Jakarta calendar)
        timeout-minutes: 5
        env:
          STRENGTH_CACHE_QA_ORIGIN: http://127.0.0.1:4173
          STRENGTH_CACHE_QA_OUTPUT: artifacts/strength-cache
        run: node scripts/qa/strength-cache-smoke.mjs

      - name: Upload strength cache evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strength-cache-ownership
          path: artifacts/strength-cache
          if-no-files-found: ignore

      - name: Longevity answered inputs and explicit zero (synthetic browser)
        timeout-minutes: 8
        env:
          PLAYWRIGHT_MODULE: '@playwright/test'
          QA_URL: http://127.0.0.1:4173/
          QA_ARTIFACT_DIR: artifacts/longevity-inputs
          QA_SOFTWARE_RENDERING: '1'
        run: node qa/longevity-check.mjs

      - name: Upload Longevity input evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longevity-answered-inputs
          path: artifacts/longevity-inputs
          if-no-files-found: ignore

      - name: Strength draft inputs (synthetic client, 390x844)
        timeout-minutes: 5
        env:
          STRENGTH_QA_ORIGIN: http://127.0.0.1:4173
          STRENGTH_QA_OUTPUT: artifacts/strength-drafts
        run: node scripts/qa/strength-draft-smoke.mjs

      - name: Upload strength draft evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strength-draft-inputs
          path: artifacts/strength-drafts
          if-no-files-found: ignore

      - name: Workout DNA duration provenance and poster (synthetic component, 390x844)
        timeout-minutes: 5
        env:
          DNA_DURATION_QA_ORIGIN: http://127.0.0.1:4173
          DNA_DURATION_QA_OUTPUT: artifacts/dna-duration
        run: node scripts/qa/workout-dna-duration-smoke.mjs

      - name: Upload Workout DNA duration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dna-duration
          path: artifacts/dna-duration
          if-no-files-found: ignore

      - name: Training duration provenance (synthetic client, 390x844)
        timeout-minutes: 5
        env:
          TRAINING_DURATION_QA_ORIGIN: http://127.0.0.1:4173
          TRAINING_DURATION_QA_OUTPUT: artifacts/training-duration
        run: node scripts/qa/training-duration-smoke.mjs

      - name: Upload training duration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-duration
          path: artifacts/training-duration
          if-no-files-found: ignore

      - name: Workout duration summary missingness (synthetic client, 390x844)
        timeout-minutes: 5
        env:
          WORKOUT_SUMMARY_QA_ORIGIN: http://127.0.0.1:4173
          WORKOUT_SUMMARY_QA_OUTPUT: artifacts/workout-duration-summary
        run: node scripts/qa/workout-duration-summary-smoke.mjs

      - name: Upload workout duration summary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workout-duration-summary
          path: artifacts/workout-duration-summary
          if-no-files-found: ignore

      - name: Workout detail duration labels (synthetic client, 390x844)
        timeout-minutes: 5
        env:
          WORKOUT_LABEL_QA_ORIGIN: http://127.0.0.1:4173
          WORKOUT_LABEL_QA_OUTPUT: artifacts/workout-duration-labels
        run: node scripts/qa/workout-duration-labels-smoke.mjs

      - name: Upload workout detail duration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workout-duration-labels
          path: artifacts/workout-duration-labels
          if-no-files-found: ignore

      - name: Workout duration provenance and consumer guards (synthetic client, 390x844)
        timeout-minutes: 5
        env:
          WORKOUT_DURATION_QA_ORIGIN: http://127.0.0.1:4173
          WORKOUT_DURATION_QA_OUTPUT: artifacts/workout-duration
        run: node scripts/qa/workout-duration-smoke.mjs

      - name: Upload workout duration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workout-duration-boundaries
          path: artifacts/workout-duration
          if-no-files-found: ignore

      - name: Logged calories distinguish missing from zero (synthetic client, 390x844)
        timeout-minutes: 5
        env:
          LOGGED_CALORIE_QA_ORIGIN: http://127.0.0.1:4173
          LOGGED_CALORIE_QA_OUTPUT: artifacts/logged-calories
        run: node scripts/qa/logged-calorie-smoke.mjs

      - name: Upload logged calorie input evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logged-calorie-boundaries
          path: artifacts/logged-calories
          if-no-files-found: ignore

      - name: Demo wallet withdrawal (synthetic client, 390x844)
        timeout-minutes: 5
        env:
          WALLET_QA_ORIGIN: http://127.0.0.1:4173
          WALLET_QA_OUTPUT: artifacts/wallet-withdraw
        run: node scripts/qa/wallet-withdraw-smoke.mjs

      - name: Upload demo wallet withdrawal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-withdraw-validation
          path: artifacts/wallet-withdraw
          if-no-files-found: ignore

      - name: Numeric display animation (actual component, missing/zero/reduced motion)
        timeout-minutes: 5
        env:
          ANIMATION_QA_OUTPUT: artifacts/animated-number
        run: node scripts/qa/animated-number-smoke.mjs

      - name: Upload numeric display animation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animated-number-boundaries
          path: artifacts/animated-number
          if-no-files-found: ignore

      - name: BMI calculation availability (synthetic client, 390x844)
        timeout-minutes: 5
        env:
          BMI_QA_ORIGIN: http://127.0.0.1:4173
          BMI_QA_OUTPUT: artifacts/bmi-availability
        run: node scripts/qa/bmi-availability-smoke.mjs

      - name: Upload BMI availability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bmi-calculation-availability
          path: artifacts/bmi-availability
          if-no-files-found: ignore

      - name: Jet-lag cached-input and account boundaries (synthetic client, 390x844)
        timeout-minutes: 5
        env:
          JETLAG_QA_ORIGIN: http://127.0.0.1:4173
          JETLAG_QA_OUTPUT: artifacts/jetlag-inputs
        run: node scripts/qa/jetlag-input-smoke.mjs

      - name: Upload jet-lag cache evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jetlag-cache-boundaries
          path: artifacts/jetlag-inputs
          if-no-files-found: ignore

      # Alpha B7: the clinician lab-result review queue against the REAL server (fresh data file, so the doctor-verification
      # fixture starts clean) and Chromium 390x844. Fails by name: SERVER_TIDAK_SIAP, VITE_TIDAK_SIAP or E2E_GAGAL.
      - name: Install server dependencies for the lab review E2E
        working-directory: server
        run: npm ci

      - name: Alpha B7 clinician lab-result review E2E (real server, 390x844)
        timeout-minutes: 6
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/panacea-playwright/node_modules/playwright/index.mjs
        run: node scripts/qa/lab-result-review-e2e-gate.mjs

      - name: Upload Body Exposure mobile QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: body3d-mobile-qa
          path: artifacts/body3d-mobile-*
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Panacea OS mobile QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panacea-os-mobile-qa
          path: artifacts/panacea-os-mobile-*
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Priority 2 UI/UX mobile QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uiux-mobile-responsive-matrix
          path: artifacts/uiux-mobile-*/*
          if-no-files-found: warn
          retention-days: 7

      - name: Stop frontend preview
        if: always()
        run: |
          if [ -f /tmp/panacea-vite-preview.pid ]; then
            preview_pid="$(cat /tmp/panacea-vite-preview.pid)"
            kill -TERM -- "-$preview_pid" 2>/dev/null || kill -TERM "$preview_pid" 2>/dev/null || true
            sleep 1
            kill -KILL -- "-$preview_pid" 2>/dev/null || true
          fi

  # Server acceptance is independent of the browser/WebGL runner. Some backend
  # regression tests intentionally import shared root React/TSX modules, so this
  # runner installs both lockfile graphs before executing the same server
  # typecheck/build/test suite. GitHub can run both acceptance jobs in parallel.
  server-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install shared root dependencies
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Server TypeScript
        working-directory: server
        run: npm run typecheck

      - name: Server build
        working-directory: server
        run: npm run build

      - name: Server tests
        working-directory: server
        run: npm run uji
