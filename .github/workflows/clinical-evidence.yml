name: Clinical Evidence Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clinical-evidence:
    name: clinical-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate clinical evidence claims
        run: node scripts/qa/clinical-evidence-gate.mjs
