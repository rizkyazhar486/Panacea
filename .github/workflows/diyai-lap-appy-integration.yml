name: DIYAI Lap Appy Integration

on:
  push:
    branches:
      - feat/surgery-simulator-anatomy-20260908
    paths:
      - src/lib/surgerySimulatorAppendectomy.ts
      - scripts/stabilization/apply-diyai-lap-appy.mjs
      - .github/workflows/diyai-lap-appy-integration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/surgery-simulator-anatomy-20260908
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply guarded DIYAI Lap Appy patch
        run: node scripts/stabilization/apply-diyai-lap-appy.mjs

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Deterministic regression suite
        run: npm run uji

      - name: Verify academic disclosure and source boundaries
        run: |
          grep -F "Human academic review is currently pending" src/lib/surgerySimulatorAppendectomy.ts
          grep -F "AI-assisted educational draft" src/lib/surgerySimulatorAppendectomy.ts
          grep -F "10.1093/nar/gkn613" src/lib/surgerySimulatorAppendectomy.ts
          grep -F "PMID:39720866" src/lib/surgerySimulatorAppendectomy.ts
          ! grep -F "10.1093/database/bap012" src/lib/surgerySimulatorAppendectomy.ts

      - name: Commit validated product changes only
        run: |
          rm -f scripts/stabilization/apply-diyai-lap-appy.mjs
          rm -f .github/workflows/diyai-lap-appy-integration.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No validated product changes to commit"
            exit 1
          fi
          git config user.name "panacea-stabilization-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat(surgery): add academic-gated DIYAI lap appy"
          git push origin HEAD:feat/surgery-simulator-anatomy-20260908
