name: User Journey Acceptance (F1)
# Bukti CI untuk Alpha F1 / Task 44: perjalanan pengguna di peramban terhadap aplikasi + server NYATA
# dengan identitas sintetis, pada 390x844 dan 1440x900. Satu langkah gagal = job merah (tanpa pelonggaran).
on:
  push:
    branches: [main]
    paths:
      - 'scripts/qa/user-journey-e2e.mjs'
      - 'scripts/qa/user-journey-staff.mjs'
      - 'scripts/qa/user-journey-resilience.mjs'
      - 'scripts/qa/f1-critical-action-contract.test.mjs'
      - 'scripts/qa/f1-negative-evidence*'
      - 'src/pages/clinical/LabResultReview.tsx'
      - 'src/pages/bodyhub/Harian.tsx'
      - 'src/components/clinical/**'
      - 'src/domains/lab-results/**'
      - 'src/main.tsx'
      - 'src/components/layout/**'
      - 'src/components/dashboard/OnboardingTour.tsx'
      - 'src/pages/landing/Login.tsx'
      - 'src/lib/api.ts'
      - 'src/lib/store.tsx'
      - 'server/src/auth.ts'
      - 'server/src/domains/identity/**'
      - 'src/pages/admin/Owner.tsx'
      - 'server/src/index.ts'
      - '.github/workflows/user-journey-acceptance.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  user-journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: server
      - name: F1 critical action and workflow path contracts
        run: node --test scripts/qa/f1-critical-action-contract.test.mjs scripts/qa/user-journey-resilience.test.mjs scripts/qa/user-journey-preview.test.mjs scripts/qa/f1-negative-evidence.test.mjs
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Compile production frontend for representative browser journeys
        run: VITE_API_URL=http://127.0.0.1:18790 npx vite build
      - name: Real API + real app journeys
        env:
          QA_OUT: ${{ runner.temp }}/user-journey-evidence.json
        run: |
          (cd server && OWNER_EMAIL=owner-f1@example.com ALLOW_DEV_LOGIN=true CORS_ORIGINS=http://localhost:5190 \
            PANACEA_DATA_FILE="$RUNNER_TEMP/f1-data.json" PORT=18790 npx tsx src/index.ts > "$RUNNER_TEMP/f1-server.log" 2>&1) &
          api=$!
          npx vite preview --host 127.0.0.1 --port 5190 --strictPort > "$RUNNER_TEMP/f1-preview.log" 2>&1 &
          web=$!
          trap 'kill "$api" "$web" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18790/api/health >/dev/null && curl -fsS http://127.0.0.1:5190/ >/dev/null; then break; fi
            sleep 1
          done
          rc=0
          QA_URL=http://localhost:5190/ node scripts/qa/user-journey-e2e.mjs || rc=1
          # Peran staf berjalan pada server SEGAR: pembatas /api/auth (30 per 15 menit) tidak dilonggarkan dan sudah hampir habis oleh skrip di atas.
          pkill -f "src/index.ts" || true
          sleep 2
          (cd server && OWNER_EMAIL=owner-f1@example.com ALLOW_DEV_LOGIN=true CORS_ORIGINS=http://localhost:5190 \
            PANACEA_DATA_FILE="$RUNNER_TEMP/f1-staff-data.json" PORT=18790 npx tsx src/index.ts > "$RUNNER_TEMP/f1-staff-server.log" 2>&1) &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18790/api/health >/dev/null; then break; fi
            sleep 1
          done
          QA_OUT="$RUNNER_TEMP/user-journey-staff-evidence.json" QA_URL=http://localhost:5190/ node scripts/qa/user-journey-staff.mjs || rc=1
          # Ketahanan (API lambat / 5xx / pemulihan) pada halaman kritis lain, per peran. Juga pada server SEGAR; lalu dua kontrol negatif yang HARUS gagal
          # dengan nama langkah (QA_SABOTASE menyuntikkan teks bocor atau overflow ke setiap halaman): jika sabotase lolos, pendeteksi rusak dan job merah.
          fresh_server() {
            pkill -f "src/index.ts" || true
            sleep 2
            (cd server && OWNER_EMAIL=owner-f1@example.com ALLOW_DEV_LOGIN=true CORS_ORIGINS=http://localhost:5190 \
              PANACEA_DATA_FILE="$RUNNER_TEMP/f1-$1-data.json" PORT=18790 npx tsx src/index.ts > "$RUNNER_TEMP/f1-$1-server.log" 2>&1) &
            for attempt in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:18790/api/health >/dev/null; then break; fi
              sleep 1
            done
          }
          fresh_server resilience
          QA_OUT="$RUNNER_TEMP/user-journey-resilience-evidence.json" QA_URL=http://localhost:5190/ node scripts/qa/user-journey-resilience.mjs || rc=1
          for mode in bocor overflow; do
            fresh_server "negatif-$mode"
            if QA_SABOTASE=$mode QA_OUT="$RUNNER_TEMP/user-journey-resilience-negatif-$mode.json" QA_URL=http://localhost:5190/ node scripts/qa/user-journey-resilience.mjs; then
              echo "::error::Kontrol negatif '$mode' LOLOS: pendeteksi ketahanan tidak menangkap cacat yang disuntikkan"; rc=1
            elif ! node scripts/qa/f1-negative-evidence.mjs "$mode" "$RUNNER_TEMP/user-journey-resilience-negatif-$mode.json"; then
              echo "::error::Kontrol negatif '$mode' berhenti tanpa langkah gagal bernama dari pendeteksi yang tepat di semua rute"; rc=1
            fi
          done
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-journey-evidence
          path: |
            ${{ runner.temp }}/user-journey-evidence.json
            ${{ runner.temp }}/user-journey-staff-evidence.json
            ${{ runner.temp }}/user-journey-resilience-evidence.json
            ${{ runner.temp }}/user-journey-resilience-negatif-bocor.json
            ${{ runner.temp }}/user-journey-resilience-negatif-overflow.json
