name: Mongo Persistence Acceptance
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'server/**'
      - 'scripts/qa/mongo-save-drain.test.mjs'
      - '.github/workflows/mongo-persistence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mongo-persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mongo:
        # mongo 8.0.32 (digest d0d926f9…) menolak start di kernel runner 6.19–7.0.13: "MongoDB cannot start: Linux kernel versions 6.19 and newer
        # has a known incompatibility" (SERVER-121912; perbaikan SERVER-125742 hanya membuka kernel ≥ 7.0.14). Jalur 7.0 tidak terdampak
        # (tiket menyebut 8.0+). Dipin ke 7.0.43 (rilis 2026-10-02) per digest; kembalikan ke 8.x setelah kernel runner ≥ 7.0.14.
        image: mongo@sha256:1f995ad6fdb93244a1addab1b58f934a0bc2f5643c38e02f5e9d7f0c7d227a7b
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: Verify actual Mongo application restart
        working-directory: server
        env:
          PANACEA_TEST_MONGO_URI: mongodb://127.0.0.1:27017
        run: npx tsx uji/mongoRestart.uji.ts
