name: Security Baseline Inventory

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build security inventory
        run: node scripts/qa/security-baseline-inventory.mjs

      - name: Upload security inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-baseline-inventory
          path: artifacts/security-baseline-inventory.json
          if-no-files-found: error
          retention-days: 7
