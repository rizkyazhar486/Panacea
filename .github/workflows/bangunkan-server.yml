# ─────────────────────────────────────────────────────────────────────────────
# Membangunkan server gratis supaya pengingat berjadwal benar-benar terkirim.
#
# MASALAHNYA. Penjadwal notifikasi hidup DI DALAM server: tiap menit ia
# memeriksa jam tiap orang, aturan mana yang terpenuhi, lalu mengirimnya. Pada
# paket gratis Render, instansnya dimatikan setelah 15 menit tanpa permintaan —
# dan selama tertidur tidak ada satu pun pemeriksaan yang berjalan. Akibatnya
# pengingat pukul lima sore hanya terkirim bila kebetulan ada orang membuka
# aplikasinya sekitar jam itu, yang justru kebalikan dari gunanya pengingat.
#
# CARANYA. Alur kerja ini menyentuh /api/health tiap sepuluh menit. Satu
# permintaan sudah cukup membuat Render menghidupkan instansnya kembali, dan
# begitu hidup, penjadwal di dalamnya berjalan lagi seperti biasa.
#
# HANYA PADA JAM BANGUN, dan itu disengaja karena DUA alasan:
#   1. Paket gratis Render memberi 750 jam instans per bulan. Dihidupkan
#      sepanjang hari memakai sekitar 730 jam — muat, tetapi tidak menyisakan
#      apa pun untuk layanan gratis lain di akun yang sama. Dijalankan pukul
#      04.00-23.00 WIB, pemakaiannya sekitar 580 jam sebulan.
#   2. Aplikasi ini memang tidak mengirim notifikasi pada jam senyap. Menjaga
#      server tetap bangun pada jam yang tidak ada apa pun untuk dikirim adalah
#      pemborosan tanpa hasil.
#
# TIDAK ADA YANG PERLU DIISI, pada umumnya. Alamat servernya diambil dari
# variabel repositori VITE_API_URL yang memang SUDAH dipakai alur kerja
# penerbitan untuk membangun aplikasinya — nilainya persis alamat yang sama.
# Meminta orang mengisi variabel kedua berisi nilai yang sudah ada di sebelahnya
# hanyalah cara lain membuat langkah yang mudah terlewat.
#
# SERVER_URL tetap dibaca lebih dahulu bila ada, untuk keadaan yang jarang:
# server notifikasi berbeda dari server yang dipakai aplikasi. Keduanya boleh
# berupa variabel repositori maupun secret — Settings → Secrets and variables →
# Actions. Bila tidak satu pun ada, alur kerja ini berhenti sendiri TANPA
# menjadi gagal, supaya tidak mengirimi Anda pemberitahuan galat tiap sepuluh
# menit.
#
# SATU RUN MENJAGA BERJAM-JAM (2026-09-25). Riwayat 22-25 September
# menunjukkan cron "tiap 10 menit" di atas nyatanya hanya jalan 3-5 kali
# SEHARI, jadi server tertidur hampir sepanjang hari. Karena repositori ini
# publik, menit Actions gratis; satu job boleh berjalan sampai 6 jam. Maka
# tiap run kini MENGULANG sentuhan tiap 9 menit selama masih jam bangun
# (maks. 5 jam 50 menit). Cron hanya perlu berhasil beberapa kali sehari
# untuk menyambung loop berikutnya; grup concurrency menjaga hanya satu loop
# yang berjalan. Tetap gratis: tidak ada layanan berbayar.
#
# YANG JUJUR HARUS DIKATAKAN. Penjadwal GitHub Actions bersifat "sebisanya":
# pada jam sibuk ia lazim terlambat lima sampai lima belas menit, dan sesekali
# satu putaran dilewati sama sekali. Untuk membangunkan server itu tidak
# menjadi soal — server yang bangun karena telat lima menit tetap mengejar
# jadwal orang pada menit berikutnya. Ini bukan pengganti instans berbayar bila
# yang dibutuhkan ketepatan detik.
# ─────────────────────────────────────────────────────────────────────────────

name: Bangunkan server

on:
  schedule:
    # Tiap 10 menit, pukul 04.00-23.00 WIB (WIB = UTC+7).
    - cron: '*/10 21-23,0-16 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bangunkan-server
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ops/wake-server.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Sentuh /api/health
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
          SERVER_URL_SECRET: ${{ secrets.SERVER_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_API_URL_SECRET: ${{ secrets.VITE_API_URL }}
        run: bash scripts/ops/wake-server.sh keepalive
