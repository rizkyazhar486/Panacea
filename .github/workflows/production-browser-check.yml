name: Production browser check

# Verifikasi produksi dari runner GitHub (sandbox agen tidak dapat menjangkau panaceamed.id). Hanya membaca situs publik;
# tanpa rahasia, tanpa menulis ke repositori. Bukan gerbang rilis: menghasilkan bukti (laporan JSON + tangkapan layar).
on:
  workflow_dispatch:
    inputs:
      prod_url:
        description: 'Production base URL'
        required: false
        default: 'https://panaceamed.id'
  schedule:
    - cron: '41 */6 * * *'
  pull_request:
    paths:
      - 'scripts/qa/verify-deployed-sha.mjs'
      - 'scripts/qa/deploy-equivalence.mjs'
      - 'scripts/qa/production-browser-check.mjs'
      - 'scripts/qa/production-browser-mime-smoke.mjs'
      - 'scripts/qa/production-browser-verdict*'
      - 'scripts/qa/production-browser-report.mjs'
      - 'scripts/qa/production-browser-summary*'
      - '.github/workflows/production-browser-check.yml'

permissions:
  contents: read

concurrency:
  group: production-browser-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright (no repo dependency change)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install playwright@1.55.1 >/dev/null
          npx playwright install --with-deps chromium
      - name: Paired CSS MIME browser controls
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
        run: node scripts/qa/production-browser-mime-smoke.mjs
      - name: Resolve canonical main revision
        id: main
        run: |
          git fetch --no-tags origin main
          echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
      - name: Run production check
        id: check
        env:
          PROD_URL: ${{ github.event.inputs.prod_url || 'https://panaceamed.id' }}
          PROD_API_URL: ${{ vars.VITE_API_URL }}
          # Revisi main kanonik, bukan github.sha (pada pull_request itu adalah merge commit PR, bukan yang dideploy)
          EXPECT_SHA: ${{ steps.main.outputs.sha }}
          OUT: production-check
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
        run: |
          set +e
          node scripts/qa/production-browser-check.mjs
          check_code=$?
          echo "exit=$check_code" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          node scripts/qa/production-browser-summary.mjs production-check/report.json >> "$GITHUB_STEP_SUMMARY"
          summary_code=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Galat pemeriksa tetap utama; ringkasan yang gagal juga tidak boleh tampak hijau.
          if [ "$check_code" -ne 0 ]; then
            exit "$check_code"
          fi
          exit "$summary_code"
      - name: Deployed SHA vs main (E7)
        if: always()
        # Pada PR hanya melapor: produksi wajar tertinggal dari main (deploy frontend dibatch), dan itu bukan kesalahan PR ini.
        # Pada dispatch dan jadwal, hasil tertinggal/menyimpang/tidak-diketahui menggagalkan langkah ini.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        # Bukti E7: frontend (build.json) dan backend (/api/health) dibandingkan dengan main memakai kriteria deploy-equivalence.mjs.
        run: |
          git fetch --no-tags origin main
          set +e
          node scripts/qa/verify-deployed-sha.mjs "$(git rev-parse origin/main)" | tee deployed-sha.txt
          code=${PIPESTATUS[0]}
          { echo '```'; cat deployed-sha.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-check
          path: production-check/
          if-no-files-found: ignore
