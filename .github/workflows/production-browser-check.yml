name: Production browser check

# Verifikasi produksi dari runner GitHub (sandbox agen tidak dapat menjangkau panaceamed.id). Hanya membaca situs publik;
# tanpa rahasia, tanpa menulis ke repositori. Bukan gerbang rilis: menghasilkan bukti (laporan JSON + tangkapan layar).
on:
  workflow_dispatch:
    inputs:
      prod_url:
        description: 'Production base URL'
        required: false
        default: 'https://panaceamed.id'
  pull_request:
    paths:
      - 'scripts/qa/production-browser-check.mjs'
      - '.github/workflows/production-browser-check.yml'

permissions:
  contents: read

concurrency:
  group: production-browser-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright (no repo dependency change)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install playwright@1.55.1 >/dev/null
          npx playwright install --with-deps chromium
      - name: Resolve canonical main revision
        id: main
        run: |
          git fetch --no-tags origin main
          echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
      - name: Run production check
        id: check
        env:
          PROD_URL: ${{ github.event.inputs.prod_url || 'https://panaceamed.id' }}
          PROD_API_URL: ${{ vars.VITE_API_URL }}
          # Revisi main kanonik, bukan github.sha (pada pull_request itu adalah merge commit PR, bukan yang dideploy)
          EXPECT_SHA: ${{ steps.main.outputs.sha }}
          OUT: production-check
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
        run: |
          set +e
          node scripts/qa/production-browser-check.mjs
          code=$?
          echo "exit=$code" >> "$GITHUB_STEP_SUMMARY"
          if [ -f production-check/report.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            node -e "const r=require('./production-check/report.json');console.log(JSON.stringify({network:r.network,server:r.server,findings:r.findings,viewports:r.viewports.map(v=>({w:v.width,status:v.status,overflowX:v.overflowX,webgl2:v.webgl2,errors:v.errors.length,body:v.body&&{canvas:v.body.canvasPresent,finalUrl:v.body.finalUrl}}))},null,1))" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-check
          path: production-check/
          if-no-files-found: ignore
