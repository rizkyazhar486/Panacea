name: Diagnose offline tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture exact offline suite
        id: offline
        shell: bash
        run: |
          set +e
          npm run uji > /tmp/panacea-uji.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish offline diagnostic tail
        if: steps.offline.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '<!-- panacea-offline-diagnostic -->'
            echo 'Temporary `npm run uji` diagnostic:'
            echo '```text'
            tail -n 220 /tmp/panacea-uji.log
            echo '```'
          } > /tmp/panacea-offline-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/panacea-offline-comment.md
      - name: Offline suite result
        if: steps.offline.outputs.exit_code != '0'
        run: exit 1
