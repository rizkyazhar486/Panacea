name: Deploy to Cloudflare Pages (24/7 Production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
    # Secrets cannot appear in a step `if`, and a step's own `env` is not visible to
    # its `if`. Expose only a yes/no flag job-wide so the token itself never reaches
    # `npm ci` install scripts or the build; the publish step alone receives it.
    env:
      HAS_CLOUDFLARE_CREDENTIALS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run verification suite
        run: npm run uji
      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      # cloudflare/pages-action is gone from GitHub ("Unable to resolve action", every
      # main run since dcdaef8), so the whole job failed at setup before any step ran.
      # Cloudflare's supported replacement is wrangler-action running `pages deploy`.
      # Without both secrets the publish is skipped; the build/verification above
      # still has to pass.
      - name: Publish to Cloudflare Pages
        if: ${{ env.HAS_CLOUDFLARE_CREDENTIALS == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=panaceamed --branch=main
