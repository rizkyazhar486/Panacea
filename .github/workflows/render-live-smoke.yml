name: Render live genomics smoke

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/render-live-smoke.yml'
      - 'scripts/ops/render-live-smoke.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-live-genomics-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for Render deployment and verify genomics API
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
          SERVER_URL_SECRET: ${{ secrets.SERVER_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_API_URL_SECRET: ${{ secrets.VITE_API_URL }}
        # Skrip dipindah ke scripts/ops agar dapat diuji (scripts/qa/render-live-smoke.test.mjs); layanan disuspend gagal segera dengan alasannya.
        run: bash scripts/ops/render-live-smoke.sh
