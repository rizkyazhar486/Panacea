name: Dependency Audit Gate

# Fails on any high/critical advisory in the production dependency tree that is not
# explicitly accepted in governance/dependency-audit-policy.json. It also runs on a
# schedule so a newly published advisory is noticed without any code change.
on:
  schedule:
    - cron: '23 3 * * 1'
  push:
    branches: [main]
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'server/package.json'
      - 'server/package-lock.json'
      - 'governance/dependency-audit-policy.json'
      - 'scripts/qa/dependency-audit-gate.mjs'
      - '.github/workflows/dependency-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm audit` exits non-zero whenever it finds anything, so its status is not the verdict.
      # The gate is: it also fails closed when the audit output is empty, errored or malformed.
      - name: Audit web production dependencies
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit-web.json" || true
          node scripts/qa/dependency-audit-gate.mjs --workspace web --file "$RUNNER_TEMP/audit-web.json"

      - name: Audit server production dependencies
        working-directory: server
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit-server.json" || true
          node ../scripts/qa/dependency-audit-gate.mjs --workspace server --file "$RUNNER_TEMP/audit-server.json" --policy ../governance/dependency-audit-policy.json
