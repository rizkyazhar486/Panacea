name: Stabilization Body3D Patch

on:
  push:
    branches:
      - claude/continue-previous-task-un3s83
    paths:
      - scripts/stabilization/apply-body3d-runtime-fix.mjs
      - .github/workflows/stabilization-body3d-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: claude/continue-previous-task-un3s83
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply guarded source patch
        run: node scripts/stabilization/apply-body3d-runtime-fix.mjs

      - name: Verify TypeScript and production build
        run: |
          npm ci
          npm run build

      - name: Commit patched source
        run: |
          if git diff --quiet -- src/components/Body3D.tsx; then
            echo 'No Body3D change was produced.'
            exit 1
          fi
          git config user.name 'panacea-stabilization-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/Body3D.tsx
          git commit -m 'fix(body): preserve anatomy geometry and suspend hidden rendering'
          git push origin HEAD:claude/continue-previous-task-un3s83
