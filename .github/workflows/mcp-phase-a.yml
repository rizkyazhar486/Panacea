name: MCP Phase A

on:
  pull_request:
    paths:
      - 'server/src/mcp/**'
      - 'server/uji/mcp*.uji.ts'
      - 'server/package.json'
      - 'server/package-lock.json'
      - '.github/workflows/mcp-phase-a.yml'

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm ci
      - name: MCP targeted tests
        run: npm run uji:mcp
      - name: Server typecheck
        run: npm run typecheck

  sdk-lock-bootstrap:
    if: github.head_ref == 'feat/panacea-mcp-core-20260917'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate and commit official MCP SDK package files
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if grep -q '"@modelcontextprotocol/server": "2.0.0"' package.json; then
            echo 'Stable MCP SDK package files already committed.'
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --save-exact \
            @modelcontextprotocol/server@2.0.0 \
            @modelcontextprotocol/node@2.0.0 \
            @modelcontextprotocol/express@2.0.0 \
            zod@4
          git fetch origin "$HEAD_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$HEAD_BRANCH")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No generated package changes.'
            exit 0
          fi
          git commit -m 'build(mcp): add stable v2 SDK dependencies'
          git push origin "HEAD:$HEAD_BRANCH"
