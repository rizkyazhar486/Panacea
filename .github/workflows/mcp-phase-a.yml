name: MCP Phase A

on:
  push:
    branches:
      - main
    paths:
      - 'server/src/mcp/**'
      - 'server/uji/mcp*.uji.ts'
      - 'server/package.json'
      - 'server/package-lock.json'
      - '.github/workflows/mcp-phase-a.yml'
  pull_request:
    paths:
      - 'server/src/mcp/**'
      - 'server/uji/mcp*.uji.ts'
      - 'server/package.json'
      - 'server/package-lock.json'
      - '.github/workflows/mcp-phase-a.yml'

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm ci
      - name: MCP targeted tests
        run: npm run uji:mcp
      - name: Server typecheck
        run: npm run typecheck
