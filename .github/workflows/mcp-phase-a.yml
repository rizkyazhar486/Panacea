name: MCP Phase A

on:
  pull_request:
    paths:
      - 'server/src/mcp/**'
      - 'server/uji/mcp*.uji.ts'
      - 'server/package.json'
      - 'server/package-lock.json'
      - '.github/workflows/mcp-phase-a.yml'

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm ci
      - name: MCP targeted tests
        run: npm run uji:mcp
      - name: Server typecheck
        run: npm run typecheck

  sdk-lock-bootstrap:
    if: github.head_ref == 'feat/panacea-mcp-core-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate official MCP SDK package files
        run: >-
          npm install --package-lock-only --ignore-scripts --save-exact
          @modelcontextprotocol/server@2.0.0
          @modelcontextprotocol/node@2.0.0
          @modelcontextprotocol/express@2.0.0
          zod@4
      - name: Upload generated package files
        uses: actions/upload-artifact@v4
        with:
          name: mcp-sdk-package-files
          path: |
            server/package.json
            server/package-lock.json
          if-no-files-found: error
          retention-days: 1
