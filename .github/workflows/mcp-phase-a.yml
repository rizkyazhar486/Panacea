name: MCP Phase A

on:
  pull_request:
    paths:
      - 'server/src/mcp/**'
      - 'server/uji/mcp*.uji.ts'
      - 'server/package.json'
      - 'server/package-lock.json'
      - '.github/workflows/mcp-phase-a.yml'

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm ci
      - name: MCP targeted tests
        run: npm run uji:mcp
      - name: MCP backend mount contract
        run: npx tsx uji/mcpMount.uji.ts
      - name: Server typecheck
        run: npm run typecheck

  backend-wiring:
    if: github.head_ref == 'feat/panacea-mcp-core-20260917'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Wire MCP mount into backend
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/src/index.ts')
          text = path.read_text()
          import_line = "import { mountHttpMcp } from './mcp/mount.js'\n"
          call_line = 'mountHttpMcp(app)\n'

          if import_line not in text:
              anchor = "import { attachRealtime } from './realtime.js'\n"
              if anchor not in text:
                  raise SystemExit('MCP wiring import anchor not found')
              text = text.replace(anchor, anchor + import_line, 1)

          if call_line not in text:
              anchor = "app.use('/api', globalLimiter)\n"
              if anchor not in text:
                  raise SystemExit('MCP wiring limiter anchor not found')
              text = text.replace(anchor, anchor + call_line, 1)

          path.write_text(text)
          PY
          git fetch origin "$HEAD_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$HEAD_BRANCH")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/src/index.ts
          if git diff --cached --quiet; then
            echo 'Backend MCP wiring already present.'
            exit 0
          fi
          git commit -m 'feat(mcp): mount remote endpoint behind API limiter'
          git push origin "HEAD:$HEAD_BRANCH"
