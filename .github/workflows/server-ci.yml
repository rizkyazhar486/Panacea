name: Render backend CI

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck backend
        run: npm run typecheck
      - name: Build backend
        run: npm run build
      - name: Test ClinicalTrials adapter
        run: npm run uji:trials
      - name: Test PubMed adapter
        run: npm run uji:pubmed
      - name: Runtime smoke-test genomics control plane
        env:
          JWT_SECRET: ci-only-panacea-genomics-secret
          PORT: '8799'
          CORS_ORIGINS: http://localhost:5173
        run: |
          set -euo pipefail
          node dist/index.js >/tmp/panacea-backend.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8799/api/genomics/compute/capabilities >/tmp/genomics-capabilities.json; then
              break
            fi
            sleep 1
          done

          if [ ! -s /tmp/genomics-capabilities.json ]; then
            cat /tmp/panacea-backend.log
            echo 'Genomics capabilities endpoint did not become ready.' >&2
            exit 1
          fi

          node -e '
            const fs = require("node:fs");
            const body = JSON.parse(fs.readFileSync("/tmp/genomics-capabilities.json", "utf8"));
            if (body.backend !== "render-control-plane") throw new Error(`Unexpected backend: ${body.backend}`);
            if (body.configured !== false) throw new Error("CI must report genomics worker as unconfigured without secrets");
            for (const kind of ["ont-basecalling", "pharmcat", "sv-calling"]) {
              if (!body.jobKinds?.includes(kind)) throw new Error(`Missing genomics job kind: ${kind}`);
            }
          '

          HTTP_CODE=$(curl -sS -o /tmp/genomics-unauth.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"kind":"ont-basecalling","input":{"uri":"https://example.test/input.pod5"}}' \
            http://127.0.0.1:8799/api/genomics/compute/jobs)
          test "$HTTP_CODE" = '401'
          grep -q '"unauthorized"' /tmp/genomics-unauth.json
